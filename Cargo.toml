[package]
name = "boilert"
version = "1.1.0"
edition = "2024"


[dependencies]
slint = "1.12.1"
tokio = { version = "1.42.2", features = ["full"] }
rumqttc = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
toml = "1.1"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
pi = []

[build-dependencies]
slint-build = "1.12.1"
